backend:
  name: github
  repo: elco555/Catalog
  branch: main

# base_url ו-auth_endpoint נדרשים רק אם משתמשים בשרת OAuth עצמאי (למשל דרך Cloudflare Worker / Vercel)
# מכיוון שהאתר מחובר עכשיו ל-Netlify עם OAuth מובנה, השורות האלה לא נחוצות.
# base_url: "https://YOUR-OAUTH-PROXY-URL"
# auth_endpoint: "auth"

logo_url: "https://olamhmotgim.netlify.app/images/logo.png"

publish_mode: simple
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "מוצרים בקטלוג"
    files:
      - file: "products.json"
        label: "כל המוצרים"
        name: "products"
        format: "json"
        fields:
          - label: "רשימת מוצרים"
            name: "products"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}} ₪"
            fields:
              - label: "מזהה ייחודי (id)"
                name: "id"
                widget: "string"
                hint: "פורמט: category-קוד, למשל shoes-ZT13309. לא לשנות במוצר קיים!"
              - label: "שם המוצר"
                name: "name"
                widget: "string"
              - label: "קטגוריה"
                name: "category"
                widget: "select"
                options:
                  - { label: "נעליים", value: "shoes" }
                  - { label: "תיקים", value: "bags" }
                  - { label: "בגדים", value: "clothes" }
                  - { label: "שעונים", value: "watches" }
                  - { label: "אלקטרוניקה", value: "electronics" }
                  - { label: "תכשיטים", value: "jewelry" }
                  - { label: "כובעים", value: "Hats" }
                  - { label: "משקפי שמש", value: "Sunglasses" }
                  - { label: "חגורות", value: "Belts" }
                  - { label: "צעיפים", value: "Scarves" }
              - label: "מותג (brand)"
                name: "brand"
                widget: "string"
                hint: "חובה להקליד באותיות קטנות! מפתחות קיימים: adidas, hermes, lv, chanel, fendi, dior, rolex, patek_philippe, tous, polo, north_face, armani, generic. אפשר כמה מופרדים בפסיק (למשל chanel,fendi). מותג חדש שלא ברשימה - תוסיף גם ל-BRAND_LABELS בקובץ script.js כדי שיוצג יפה."
              - label: "מחיר"
                name: "price"
                widget: "number"
                value_type: "int"
              - label: "מטבע"
                name: "currency"
                widget: "string"
                default: "₪"
              - label: "תיאור"
                name: "description"
                widget: "text"
              - label: "תמונות המוצר (מומלץ - העלאה ישירה כאן)"
                name: "images"
                widget: "list"
                required: false
                hint: "העלה כאן את כל תמונות המוצר לפי הסדר הרצוי. זה שומר אוטומטית את הנתיבים הנכונים לתמונות שהועלו - השתמש בשדה הזה למוצרים חדשים, ואל תמלא את שלושת השדות הבאים (תיקייה/קוד/כמות)."
                field: { label: "תמונה", name: "image", widget: "image" }
              - label: "תיקיית תמונות (רק למוצרים ישנים)"
                name: "imageFolder"
                widget: "string"
                required: false
                hint: "השאר ריק אם השתמשת בשדה 'תמונות המוצר' למעלה. רלוונטי רק למוצרים ישנים בפורמט הקודם, למשל images/shoes"
              - label: "קוד תמונה (רק למוצרים ישנים)"
                name: "imageCode"
                widget: "string"
                required: false
                hint: "השאר ריק אם השתמשת בשדה 'תמונות המוצר' למעלה."
              - label: "כמות תמונות (רק למוצרים ישנים)"
                name: "imageCount"
                widget: "number"
                value_type: "int"
                required: false
                hint: "השאר ריק אם השתמשת בשדה 'תמונות המוצר' למעלה."
              - label: "קישור לקנייה (Flylinking)"
                name: "buyLink"
                widget: "string"
