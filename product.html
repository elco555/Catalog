<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מוצר - עולם המותגים</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <button class="hamburger-btn" id="hamburger-btn" aria-label="פתח תפריט קטגוריות">
    <span></span><span></span><span></span>
  </button>
  <a href="about.html" class="about-link">אודות</a>
  <div class="header-inner">
    <img src="images/logo.png" alt="עולם המותגים" class="site-logo">
  </div>
</header>

<div class="sticky-topbar" id="sticky-topbar">
  <img src="images/logo.png" alt="עולם המותגים" class="sticky-logo">
</div>

<div class="drawer-overlay" id="drawer-overlay"></div>
<nav class="category-drawer" id="category-drawer">
  <div class="drawer-header">
    <h2>קטגוריות</h2>
    <button class="drawer-close" id="drawer-close" aria-label="סגור">✕</button>
  </div>
  <a href="index.html?category=all" class="drawer-link" data-category="all">הכל</a>
  <a href="index.html?category=shoes" class="drawer-link" data-category="shoes">נעליים</a>
  <a href="index.html?category=bags" class="drawer-link" data-category="bags">תיקים</a>
  <a href="index.html?category=clothes" class="drawer-link" data-category="clothes">בגדים</a>
  <a href="index.html?category=watches" class="drawer-link" data-category="watches">שעונים</a>
</nav>

<nav class="breadcrumb" id="breadcrumb">
  <a href="index.html">קטלוג</a>
</nav>

<a href="index.html" class="back-link">→ חזרה לכל המוצרים</a>

<div class="product-page" id="product-container">
  <!-- יטען אוטומטית -->
</div>

<div class="lightbox-overlay" id="lightbox-overlay">
  <div class="lightbox-toolbar">
    <button class="lightbox-btn" id="lightbox-fullscreen" title="מסך מלא">⛶</button>
    <button class="lightbox-btn" id="lightbox-close" title="סגור">✕</button>
  </div>
  <div class="lightbox-stage">
    <img id="lightbox-img" src="" alt="">
  </div>
</div>

<footer class="site-footer">
  <p>© 2026 עולם המותגים. כל הזכויות שמורות. <a href="about.html#contact" class="footer-contact">צור קשר</a></p>
</footer>

<script src="script.js"></script>
</body>
</html>
